<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background for standalone viewing -->
  <rect width="100%" height="100%" fill="#00091B" rx="16" />
  
  <!-- Stylized R Emblem -->
  <g transform="translate(30, 20)">
    <!-- Main R Body (White) -->
    <path d="M 10 10 L 110 10 C 155 10 185 38 185 82 C 185 116 160 138 128 146 L 188 195 L 140 195 L 90 148 L 58 148 L 58 195 L 10 195 Z" fill="#FFFFFF" />
    
    <!-- Cyan Accent Wedge at Bottom-Left of R -->
    <polygon points="10,135 60,135 60,195 10,195" fill="#01BDFC" />
    
    <!-- Eye cutout inside R bowl -->
    <g transform="translate(15, 10)">
      <!-- Dark Eye Sclera / Outer Almond -->
      <path d="M 38 72 C 58 42, 118 42, 142 72 C 118 102, 58 102, 38 72 Z" fill="#00091B" />
      <!-- Cyan Iris -->
      <circle cx="90" cy="72" r="22" fill="#01BDFC" filter="url(#glow)" />
      <!-- Black Pupil -->
      <circle cx="90" cy="72" r="11" fill="#00091B" />
      <!-- Light Reflection Specular -->
      <circle cx="95" cy="66" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(255, 30)">
    <!-- Line 1: RIGHT - EYE -->
    <text x="0" y="68" font-family="'Montserrat', 'Syne', 'Inter', system-ui, sans-serif" font-size="62" font-weight="900" letter-spacing="4" fill="#FFFFFF">RIGHT</text>
    <!-- Cyan Hyphen Dash -->
    <rect x="235" y="42" width="36" height="12" rx="2" fill="#01BDFC" />
    <text x="285" y="68" font-family="'Montserrat', 'Syne', 'Inter', system-ui, sans-serif" font-size="62" font-weight="900" letter-spacing="4" fill="#FFFFFF">EYE</text>

    <!-- Line 2: Technology -->
    <text x="4" y="128" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="400" letter-spacing="3" fill="#FFFFFF">Technology</text>

    <!-- Line 3: Digital Solutions & Business Excellence -->
    <text x="4" y="168" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="2" fill="#94A3B8">
      Digital Solutions <tspan fill="#01BDFC" font-weight="700">&amp;</tspan> Business Excellence
    </text>
  </g>
</svg>